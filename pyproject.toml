[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-system"
version = "0.1.0"
description = "Room-scoped workspaces and durable human-plus-agent delivery"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
relay = "app.cli:main"

[tool.setuptools]
packages = ["app"]
